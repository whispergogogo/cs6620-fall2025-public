# This workflow builds and pushes Docker images to Docker Hub, then deploys to EC2 via SSM
name: Docker Build, Push, and Deploy

on:
  push:
    branches:
      - week02

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  deploy:
    name: Deploy to EC2 via SSM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send deploy command to EC2 using SSM
        id: ssm
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          REGION="${{ secrets.AWS_REGION }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest"
          CONTAINER_NAME="cs6620-app"

          COMMAND_ID=$(aws ssm send-command \
            --region "$REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Automated deployment from GitHub Actions via SSM" \
            --parameters commands="[
              \"set -e\",
              \"echo '--- Deploy: pull latest image ---'\",
              \"sudo docker pull $IMAGE\",
              \"echo '--- Stop old container (if exists) ---'\",
              \"sudo docker stop $CONTAINER_NAME || true\",
              \"echo '--- Remove old container (if exists) ---'\",
              \"sudo docker rm $CONTAINER_NAME || true\",
              \"echo '--- Run new container ---'\",
              \"sudo docker run -d --restart unless-stopped --name $CONTAINER_NAME -p 80:5000 $IMAGE\",
              \"echo '--- Done. docker ps ---'\",
              \"sudo docker ps | head -50\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM CommandId: $COMMAND_ID"

      - name: Wait for SSM command to complete
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Print SSM output (stdout/stderr)
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json
